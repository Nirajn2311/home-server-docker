version: "3"
services:
  heimdall:
    image: linuxserver/heimdall:2.8.1@sha256:83b97a1ba126b19d27f2e73522518f532c6bd71500cc5e3ae483a62ed6e4b268
    container_name: heimdall
    restart: always
    environment:
      - PGID=1000
      - PUID=1000
    ports:
      - "9000:443"
    volumes:
      - ./config:/config
    labels:
      - com.centurylinklabs.watchtower.enable=true
