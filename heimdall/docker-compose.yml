version: "3"
services:
  heimdall:
    image: linuxserver/heimdall:2.8.4@sha256:6a1fcd0a144ec370c710b7897bae0be55aed83925f43ccd7c82d1a274ee423c2
    container_name: heimdall
    restart: always
    environment:
      - PGID=1000
      - PUID=1000
    ports:
      - "9000:443"
    volumes:
      - ./config:/config
    labels:
      - com.centurylinklabs.watchtower.enable=true
